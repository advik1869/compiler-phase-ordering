[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-ordering-optimizer"
version = "0.1.0"
description = "A small educational TAC optimizer for studying compiler phase ordering."
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "streamlit>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
